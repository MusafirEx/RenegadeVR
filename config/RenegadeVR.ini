; RenegadeVR development configuration

[General]
Enabled=1
LogLevel=Debug

[VR]
Enabled=1
Runtime=OpenXR
UseXRHost=1

; First OpenXR milestone: orientation tracking only.
; Stereo eye rendering and motion controllers remain disabled.
StereoRendering=0
HeadTracking=1
MotionControllers=0

; Experimental culling fix.
; Yaw/pitch are fed into Renegade's real gameplay camera so the engine frustum
; and visibility collection follow the headset instead of the original monitor
; camera. Roll remains a final D3D view transform.
EngineCameraSteering=1

[Rendering]
Backend=SystemD3D8
UseDXVK=0

[Debug]
ShowConsole=0
LogD3D8Calls=0

; Manual camera transform is now disabled by default.
; Re-enable only when testing camera maths without a headset.
EnableCameraRotationTest=0
CameraYawDegrees=0.0
CameraPitchDegrees=0.0
CameraRollDegrees=0.0

[Input]
; Fix Renegade DirectInput mouse not being reacquired when gameplay first starts.
; Disable only for troubleshooting.
AutoRestoreMouseFocus=1

; Renegade converts mouse counts to camera radians using MouseScale.
; 0.0025 matches the game's default MouseSensitivity=0.5.
; If your in-game mouse sensitivity is different, adjust this value to match:
; MouseScale = 25 * 10^(2 * MouseSensitivity - 5)
EngineMouseScale=0.0025

; Axis signs for synthetic relative mouse input. Change only if physical HMD
; movement drives the engine camera in the wrong direction.
EngineSteeringYawSign=1.0
EngineSteeringPitchSign=-1.0
