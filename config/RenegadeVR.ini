; RenegadeVR development configuration

[General]
Enabled=1
LogLevel=Debug

[VR]
Enabled=1
Runtime=OpenXR
UseXRHost=1

; First OpenXR milestone: orientation tracking only.
; Stereo eye rendering and motion controllers remain disabled.
StereoRendering=0
HeadTracking=1
MotionControllers=0

[Rendering]
Backend=SystemD3D8
UseDXVK=0

[Debug]
ShowConsole=0
LogD3D8Calls=0

; Manual camera transform is now disabled by default.
; Re-enable only when testing camera maths without a headset.
EnableCameraRotationTest=0
CameraYawDegrees=0.0
CameraPitchDegrees=0.0
CameraRollDegrees=0.0

[Input]
; Fix Renegade DirectInput mouse not being reacquired when gameplay first starts.
; Disable only for troubleshooting.
AutoRestoreMouseFocus=1
